engine:
  load_model_args:
    model: anole
    model_ckpt: null
    image_seq_length: 784
    device: cuda
    do_train: false
    do_single_step_eval: false
    do_task_level_eval: true
    do_rollout_eval: false
    use_memory_bank_inference: true
    memory_context_smoothing_tau: 0.75

  action_token_generation:
    range_profile: habitat
    bin_step: 0.01

  generation:
    prompt_style_idx: 0
    action:
      max_new_tokens: 32
      pad_token_id: 2
      multimodal_generation_mode: text-only
      current_substep: action
      return_dict_in_generate: True
      output_scores: True
    visualization:
      max_new_tokens: 800
      num_beams: 1
      temperature: 0.7
      top_p: 0.9
      pad_token_id: 2
      multimodal_generation_mode: image-only
      current_substep: visualization
      return_dict_in_generate: True
      output_scores: True

  training:
    hyper_params:
      initial_lr: 2e-5

    visualization:
      use_cache: false

    loss:
      include_action_loss: true
      include_image_loss: true
      action_loss_weight: 1.0
      image_loss_weight: 1.0
      ignore_index: -100
      log_prefix: "habitat_loss_"

wrapper:
  max_route_steps: 3
  full_replan_threshold: 0.25
  divergence_metric: mean_absolute_error
  replan_on_route_exhausted: true
  log_predicted_obs: true
  log_real_obs: true
  add_global_memories: true
  training_enabled: true

  enable_modulators: True
  min_memories_for_confidence: 5
  viz_loss_slow_ema: 0.95
  viz_loss_fast_ema: 0.6

runner:
  max_episode_steps: 3
  stop_on_wrapper_done: true
  log_every_step: true
  source_file_name: habitat_source_tools

  adapter_params:
    config_path: benchmark/nav/instance_imagenav/instance_imagenav_hm3d_v2.yaml
    split: val_mini
    data_path: data/datasets/instance_imagenav/hm3d/instance_imagenav_hm3d_v3/val_mini/val_mini.json.gz
    scenes_dir: data/scene_datasets
    max_episode_steps: 500
    seed: 100

  formatter_params:
    linear_deadband: 0.01
    angular_deadband: 0.01
    image_w: 448
    image_h: 448

modulators:
  viz_ema_tau:
    ach: 0.65
    ne: 0.75

  viz_learning_mods:
    ach_base_weight: 0.25
    ne_bias: 0.5
    ne_range: [0.25, 1.0]
    ne_curve_width: 0.6
  
  viz_norm_scalers:
    novelty: 0.3
    learning_surprise: 0.4
    learning_progress: 0.4
    persistent_loss: 4.0
