engine:
  load_model_args:
    model: anole
    model_ckpt: ./checkpoints/base_ckpt
    update_model_on_save: false
    image_seq_length: 784
    device: cuda
    do_train: false
    do_single_step_eval: false
    do_task_level_eval: true
    do_rollout_eval: false
    use_memory_bank_inference: true

  memory_bank_args:
    top_k: 3
    memory_context_tau: 0.5
    verbose: false

  memory:
    min_memories: 3
    similarity_threshold: 0.5
    stability_margin: 0.05

  load_model_cfg:
    img_size: 448

  generation:
    action:
      max_new_tokens: 24
      pad_token_id: 2
      multimodal_generation_mode: text-only
      current_substep: action
      return_dict_in_generate: true
      return_legacy_cache: true
      output_scores: true
    visualization:
      max_new_tokens: 800
      num_beams: 1
      temperature: 1.0
      top_p: 1.0
      pad_token_id: 2
      multimodal_generation_mode: image-only
      current_substep: visualization
      return_dict_in_generate: true
      return_legacy_cache: true
      output_scores: true
      do_sample: false

  training:
    hyper_params:
      initial_lr: 1e-4
      max_grad_norm: 1.0

    visualization:
      use_cache: false

    loss:
      include_action_loss: false
      include_image_loss: false
      action_loss_weight: 0.0
      image_loss_weight: 0.0
      ignore_index: -100
      log_prefix: "habitat_loss_"

wrapper:
  max_route_steps: 5
  full_replan_threshold: 0.18
  divergence_metric: mean_absolute_error
  replan_on_route_exhausted: true
  log_predicted_obs: true
  log_real_obs: true
  add_global_memories: true
  eval_forced_action: false
  training_enabled: false

  enable_modulators: true
  learning_rate_schedule:
    mode: record
    shuffled_seed: 20260827
  min_memories_for_confidence: 5
  viz_loss_slow_ema: 0.95
  viz_loss_fast_ema: 0.6

runner:
  source_type: "habitat"
  max_episode_steps: 25
  source_max_episodes: 12
  stop_on_wrapper_done: true
  log_every_step: true
  source_file_name: habitat_source_tools
  save_model_weights: true

  adapter_params:
    config_path: benchmark/nav/instance_imagenav/instance_imagenav_hm3d_v2.yaml
    split: val
    data_path: data/datasets/instance_imagenav/hm3d/instance_imagenav_hm3d_v3/val/val.json.gz
    scenes_dir: data/scene_datasets
    seed: 100
    bin_step: 0.01
    episode_ids: ["827", "352", "817", "338", "346", "997", "743", "39", "449", "66", "887", "404"]
    fixed_action_run_dir: thesis_artifacts/habitat_fixed_actions/no_learning

    extra_overrides:
      - habitat.environment.max_episode_steps=0
      - habitat.environment.iterator_options.shuffle=false
      - habitat.environment.iterator_options.group_by_scene=false

modulators:
  visualization:
    decay_tau:
      ach: 0.5
      ne:  0.6

    learning_mods:
      ach_base_weight: 0.5
      ne_bias:         0.5
      ne_range:        [0.25, 1.0]
      ne_curve_width:  0.6
    
    norm_scalers:
      novelty:           0.3
      learning_surprise: 0.4
      learning_progress: 0.4
      persistent_loss:   12.0

    event_strengths:
      pred_mismatch:     [0.15, 0.25]
      mem_novelty:       [0.30, 0.10]
      act_uncertainty:   [0.00, 0.10]
      viz_uncertainty:   [0.05, 0.55]
      learning_surprise: [0.00, 0.35]
      learning_progress: [0.40, 0.00]
      persistent_error:  [0.20, 0.10]
