hyper:
  seed: 42
  epochs: 10
  lr: 0.0002
  train_batch_size: 1
  val_batch_size: 1
  grad_accumulation: 2

model:
  predict_with_generate: True
  generation_max_new_tokens: 300
  generation_num_beams: 1

eval:
  eval_strategy: "steps"
  eval_steps: 30000
  metric: "task_acc"

save:
  save_strategy: "steps"
  save_steps: 30000

logging:
  logging_step: 200
