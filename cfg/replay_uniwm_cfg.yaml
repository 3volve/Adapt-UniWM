engine:
  load_model_args:
    model: anole
    model_ckpt: ./checkpoints/base_ckpt
    update_model_on_save: false
    image_seq_length: 784
    device: cuda
    do_train: false
    do_single_step_eval: false
    do_task_level_eval: true
    do_rollout_eval: false
    use_memory_bank_inference: true

  memory_bank_args:
    top_k: 3
    memory_context_tau: 0.5

  memory:
    min_memories: 3
    similarity_threshold: 0.5
    stability_margin: 0.05

  load_model_cfg:
    img_size: 448
    
  generation:
    action:
      max_new_tokens: 24
      pad_token_id: 2
      multimodal_generation_mode: text-only
      current_substep: action
      return_dict_in_generate: true
      return_legacy_cache: true
      output_scores: true
    visualization:
      max_new_tokens: 800
      num_beams: 1
      temperature: 1.0
      top_p: 1.0
      pad_token_id: 2
      multimodal_generation_mode: image-only
      current_substep: visualization
      return_dict_in_generate: true
      return_legacy_cache: true
      output_scores: true

  training: false

wrapper:
  max_route_steps: 5
  full_replan_threshold: 0.12
  divergence_metric: mean_absolute_error
  replan_on_route_exhausted: true
  log_predicted_obs: true
  log_real_obs: true
  add_global_memories: false
  eval_forced_action: true

  training_enabled: false
  enable_modulators: false
  min_memories_for_confidence: 5
  viz_loss_slow_ema: 0.95
  viz_loss_fast_ema: 0.6

runner:
  source_type: "replay"
  max_episode_steps: 50
  stop_on_wrapper_done: true
  log_every_step: true
  source_file_name: replay_source_tools
  source_max_episodes: 64
  save_model_weights: false

  adapter_params:
    data_root: eval_data
    manifest_path: cfg/eval_dataset_manifest.json
    manifest_split: test

modulators: false