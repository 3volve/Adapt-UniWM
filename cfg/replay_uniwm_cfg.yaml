engine:
  load_model_args:
    model: anole
    model_ckpt: null
    image_seq_length: 784
    device: cuda
    do_train: false
    do_single_step_eval: false
    do_task_level_eval: true
    do_rollout_eval: false
    use_memory_bank_inference: true

  action_token_generation:
    range_profile: unknown
    bin_step: 0.01

  generation:
    prompt_style_idx: 0
    action:
      max_new_tokens: 64
      multimodal_generation_mode: text-only
      current_substep: action
    visualization:
      max_new_tokens: 800
      num_beams: 1
      temperature: 0.7
      top_p: 0.9
      multimodal_generation_mode: image-only
      current_substep: visualization

  training:
    hyper_params:
      initial_lr: 2e-5

    visualization:
      use_cache: false

    loss:
      include_action_loss: true
      include_image_loss: true
      action_loss_weight: 1.0
      image_loss_weight: 1.0
      ignore_index: -100
      log_prefix: "replay_loss_"

  route:
    max_steps: 10


wrapper:
  max_route_steps: 8
  full_replan_threshold: 0.12
  divergence_metric: mean_absolute_error
  replan_on_route_exhausted: true
  memory_mode: "off"
  log_predicted_observations: true
  log_real_observations: true
  add_global_memories: false
  training_enabled: false

runner:
  max_episode_steps: 100
  stop_on_wrapper_done: true
  log_every_step: true
  source_file_name: replay_source_tools
  source_max_episodes: 64

  adapter_params:
    data_root: eval_data
    manifest_path: cfg/eval_dataset_manifest.json

  formatter_params:
    linear_deadband: 0.02
    angular_deadband: 0.02
    image_w: 256
    image_h: 256