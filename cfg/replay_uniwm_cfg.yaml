engine:
  load_model_args:
    model: anole
    model_ckpt: ./checkpoints/main_ckpt
    image_seq_length: 784
    device: cuda
    do_train: false
    do_single_step_eval: false
    do_task_level_eval: true
    do_rollout_eval: false
    use_memory_bank_inference: true

  memory_bank:
    top_k: 1
    memory_context_tau: 0.75

  load_model_cfg:
    img_size: 448
    
  action_token_generation:
    bin_step: 0.01

  generation:
    prompt_style_idx: 0
    action:
      max_new_tokens: 64
      pad_token_id: 2
      multimodal_generation_mode: text-only
      current_substep: action
      return_dict_in_generate: True
      output_scores: True
    visualization:
      max_new_tokens: 800
      num_beams: 1
      temperature: 1.0
      top_p: 1.0
      pad_token_id: 2
      multimodal_generation_mode: image-only
      current_substep: visualization
      return_dict_in_generate: True
      output_scores: True

  training:
    hyper_params:
      initial_lr: 5e-4

    visualization:
      use_cache: false

    loss:
      include_action_loss: true
      include_image_loss: true
      action_loss_weight: 1.0
      image_loss_weight: 1.0
      ignore_index: -100
      log_prefix: "replay_loss_"

    memory:
      min_memories: 3
      similarity_threshold: 0.6
      stability_margin: 0.05

wrapper:
  max_route_steps: 8
  full_replan_threshold: 0.12
  divergence_metric: mean_absolute_error
  replan_on_route_exhausted: true
  log_predicted_obs: true
  log_real_obs: true
  add_global_memories: false
  eval_forced_action: true
  training_enabled: false

  enable_modulators: True
  min_memories_for_confidence: 5
  viz_loss_slow_ema: 0.95
  viz_loss_fast_ema: 0.6

runner:
  max_episode_steps: 100
  stop_on_wrapper_done: true
  log_every_step: true
  source_file_name: replay_source_tools
  source_max_episodes: 64

  adapter_params:
    data_root: eval_data
    manifest_path: cfg/eval_dataset_manifest.json

  formatter_params:
    bin_step: 0.01
    img_size: 448

modulators:
  viz_ema_tau:
    ach: 0.65
    ne: 0.75

  viz_learning_mods:
    ach_base_weight: 0.25
    ne_bias: 0.5
    ne_range: [0.25, 1.0]
    ne_curve_width: 0.6
  
  viz_norm_scalers:
    novelty: 0.3
    learning_surprise: 0.4
    learning_progress: 0.4
    persistent_loss: 4.0
